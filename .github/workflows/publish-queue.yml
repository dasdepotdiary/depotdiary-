name: Publish queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run queue
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: python scripts/run_queue.py

      - name: Commit queue status
        run: |
          git config user.name "depotdiary-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet queue/publish_queue.json || (git add queue/publish_queue.json && git commit -m "Queue-Status aktualisiert [skip ci]" && git push)
